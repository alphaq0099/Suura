# The gates that used to depend on remembering to run them.
#
# Two jobs, because they need different things: `checks` needs ffmpeg (the
# smoke fixtures and the self-test generate real audio) and a desktop session
# for Electron; `perf` deliberately needs neither a window nor an audio device,
# which is why its budgets are safe on a hosted runner.
#
# Selftest runs the built `out/` bundles, so `npm run build` comes first and
# carries the typecheck. The perf job builds its own copy: the two jobs are
# independent and neither waits for the other.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, smoke and self-test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # smoke.ts exits 2 when ffmpeg is missing, because it cannot generate a
      # fixture; the self-test records the same absence as a failure.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Build (typecheck included)
        run: npm run build

      - name: Smoke
        run: npm run smoke

      - name: Self-test
        run: npm run selftest

  perf:
    name: Performance budgets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Perf budgets
        run: npm run perf
