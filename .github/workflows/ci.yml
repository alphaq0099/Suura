# The gates that used to depend on remembering to run them.
#
# Three jobs, because they need different things: `checks` needs ffmpeg (the
# smoke fixtures and the self-test generate real audio) and a desktop session
# for Electron; `linux` needs the same plus Xvfb, and proves the second
# platform's engine pins and paths; `perf` deliberately needs neither a window
# nor an audio device, which is why its budgets are safe on a hosted runner.
#
# Selftest runs the built `out/` bundles, so `npm run build` comes first and
# carries the typecheck. The perf job builds its own copy: the three jobs are
# independent and none waits for another.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, smoke and self-test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # smoke.ts exits 2 when ffmpeg is missing, because it cannot generate a
      # fixture; the self-test records the same absence as a failure.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Build (typecheck included)
        run: npm run build

      - name: Smoke
        run: npm run smoke

      - name: Self-test
        run: npm run selftest

  # The Linux job exists because a Windows run cannot see a wrong Linux engine
  # digest, a path that only breaks on a case-sensitive file system, or the
  # AppImage's assumptions. It does not package: the AppImage build needs FUSE
  # and produces a 124 MB file that nothing here consumes.
  linux:
    name: Typecheck, smoke and self-test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install ffmpeg and the Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck included)
        run: npm run build

      - name: Smoke
        run: npm run smoke

      # A hosted runner has no display, and Ubuntu's unprivileged user
      # namespaces are restricted there, so Chromium's own sandbox cannot start.
      # `--no-sandbox` is a runner concession, not a shipped default: the app
      # keeps the sandbox for real users.
      - name: Self-test
        run: xvfb-run -a npm run selftest -- --no-sandbox

      # Packaging needs no display and no FUSE, only the tools electron-builder
      # downloads. A broken target or a missing desktop entry fails here rather
      # than on the first person who runs a release build. The .deb is a second
      # invocation because it is built without the update feed: a package dpkg
      # owns must not advertise an in-app update the feed does not carry.
      - name: Package AppImage
        run: npx electron-builder --linux AppImage
      - name: Package deb
        run: npx electron-builder --config electron-builder.deb.yml --linux deb

      # The feed the AppImage updates from must name the AppImage and nothing
      # else. A `.deb` line would advertise a file the feed does not serve, and a
      # missing AppImage line would leave the updater with nothing to fetch.
      - name: Check the Linux artifacts
        run: |
          ls -l release
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.deb' -print -quit)"
          grep -q '\.AppImage' release/latest-linux.yml
          ! grep -q '\.deb' release/latest-linux.yml

  perf:
    name: Performance budgets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Perf budgets
        run: npm run perf
