# Windows release packaging.
#
# The installer is per-user on purpose: a music player should install without
# asking for administrator rights. electron-builder's NSIS target installs to
# %LOCALAPPDATA%\Programs\Suura by default when perMachine is false.
#
#   npm run package:dir   unpacked build, for smoke-testing the packaged app
#   npm run package:win   NSIS installer in release/
#
# Signing is optional here and enabled by the release environment through
# CSC_LINK/CSC_KEY_PASSWORD. See docs/release/windows.md.

appId: com.suura.desktop
productName: Suura
copyright: Copyright © 2026 alphaq0099

directories:
  output: release
  buildResources: build

# A generic provider makes electron-builder write the channel file
# (latest.yml, or beta.yml for a prerelease version) beside the installer.
# The URL is the public R2 folder that ships as the app's default feed, so the
# generated metadata describes where the files really live. The app still reads
# the feed folder from Settings, and nothing is uploaded unless `--publish` is
# passed explicitly.
publish:
  provider: generic
  url: https://pub-f78cb36c07324422ba352033e3d71909.r2.dev

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true

# music-metadata is ESM loaded through Node's require(esm). Keeping production
# modules as real files avoids depending on Electron's asar ESM loader and costs
# little in a small app.
asarUnpack:
  - node_modules/**

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Suura
  uninstallDisplayName: Suura
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

# Linux is a second target, not a port: the core, the player and the engine
# already run there; what differs is packaging, the autostart entry and the
# updater's channel file (`latest-linux.yml`). AppImage first, because it is the
# only Linux target electron-updater can update in place.
linux:
  icon: build/icon.png
  category: AudioVideo
  # Electron's WM_CLASS on Linux comes from `desktopName` in package.json, and
  # the launcher matches the .desktop file against it. Without this the running
  # window is not grouped under the app's icon.
  syncDesktopName: true
  synopsis: Desktop music player for local files and YouTube links
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}
