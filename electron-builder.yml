# Windows release packaging.
#
# The installer is per-user on purpose: a music player should install without
# asking for administrator rights. electron-builder's NSIS target installs to
# %LOCALAPPDATA%\Programs\Player by default when perMachine is false.
#
#   npm run package:dir   unpacked build, for smoke-testing the packaged app
#   npm run package:win   NSIS installer in release/
#
# Signing is optional here and enabled by the release environment through
# CSC_LINK/CSC_KEY_PASSWORD. See docs/release/windows.md.

appId: com.player.desktop
productName: Player
copyright: Copyright © 2026 Player

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true

# music-metadata is ESM loaded through Node's require(esm). Keeping production
# modules as real files avoids depending on Electron's asar ESM loader and costs
# little in a small app.
asarUnpack:
  - node_modules/**

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Player
  uninstallDisplayName: Player
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
